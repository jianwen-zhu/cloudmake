# Direct OpenSSH access to a Google Compute Engine free-tier e2-micro VM.
# Replace the address and Linux username. The default gcloud key path is shown.
# If gcloud manages SSH for this VM, prefer `gcloud compute config-ssh` and pass
# its generated NAME.ZONE.PROJECT alias directly to `cloudmake --host`.
Host gcp-free
    HostName REPLACE_WITH_GCP_EXTERNAL_IP_OR_DNS_NAME
    User REPLACE_WITH_GCP_LINUX_USERNAME
    IdentityFile ~/.ssh/google_compute_engine
    IdentitiesOnly yes
    ServerAliveInterval 30
    ServerAliveCountMax 3

# OCI Always Free Linux VM. Replace the address and key filename before use.
# Ubuntu platform images use "ubuntu". Oracle Linux images use "opc" instead.
Host oci-free
    HostName REPLACE_WITH_OCI_PUBLIC_IP_OR_DNS_NAME
    User ubuntu
    IdentityFile ~/.ssh/REPLACE_WITH_OCI_PRIVATE_KEY_FILENAME
    IdentitiesOnly yes
    ServerAliveInterval 30
    ServerAliveCountMax 3

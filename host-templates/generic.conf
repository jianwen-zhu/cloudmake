# Generic existing Linux host. Replace every REPLACE_WITH value before use.
# Keep passwords, keys, certificates, ports, and jump-host policy in OpenSSH.
Host cloudmake-host
    HostName REPLACE_WITH_IP_OR_DNS_NAME
    User REPLACE_WITH_REMOTE_USER
    IdentityFile ~/.ssh/REPLACE_WITH_PRIVATE_KEY_FILENAME
    IdentitiesOnly yes
    ServerAliveInterval 30
    ServerAliveCountMax 3

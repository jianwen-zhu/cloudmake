name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate Python, shell, notebooks, and whitespace
        run: |
          python -m compileall -q cmd core backend tests
          sh -n core/remote_lock.sh tests/compatibility/projects/prepare.sh
          sh -n tests/compatibility/devcontainers/prepare.sh
          python -m json.tool backend/colab-notebook/notebook.ipynb >/dev/null
          python -m json.tool backend/kaggle-notebook/notebook.ipynb >/dev/null
          git diff --check
